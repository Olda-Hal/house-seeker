name: House Scraper

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      llm_model:
        description: 'LLM model alias (deepseek, mini, qwen3.8-27b, ...)'
        required: false
        default: 'deepseek'
      max_ai_calls:
        description: 'Max listings sent to AI in this run'
        required: false
        default: '120'
      debug:
        description: 'Log raw LLM response (1 = yes)'
        required: false
        default: '0'

concurrency:
  group: house-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync seen.json
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- seen.json || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and evaluate
        run: python main.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          E_INFRA_API_TOKEN: ${{ secrets.E_INFRA_API_TOKEN }}
          LLM_MODEL: ${{ inputs.llm_model || 'deepseek' }}
          MAX_AI_CALLS: ${{ inputs.max_ai_calls || '120' }}
          LLM_DEBUG: ${{ inputs.debug || '0' }}
          PYTHONUNBUFFERED: "1"

      - name: Commit seen listings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json beze změny"
            exit 0
          fi
          git commit -m "SCRAPE: scraped Data"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              conflicted="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "${conflicted}" ] && [ "${conflicted}" != "seen.json" ]; then
                echo "Konflikt i v jiných souborech: ${conflicted}"
                git rebase --abort
                exit 1
              fi
              python3 merge_seen.py
              git add seen.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push OK (pokus ${attempt})"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push se nepovedl ani po 5 pokusech."
          exit 1
